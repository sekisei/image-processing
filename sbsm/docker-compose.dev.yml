services:
  sbsm:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sbsm-cuda-dev
    working_dir: /workspace
    volumes:
      - ./:/workspace
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    stdin_open: true
    tty: true
